<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:;base64,=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICE Activity Map (Public View)</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
   <link rel="stylesheet" href="style.css"></link>
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
<script type="module" src="main.js"></script>
  <script src="https://survey123.arcgis.com/api/jsapi/"></script>
  </head>
  <body>
<div id="map">
    <calcite-shell>
      <calcite-navigation slot="header">
        <calcite-navigation-logo slot="logo"></calcite-navigation-logo>
        <calcite-button slot="content-end" appearance="solid" scale="s" href="org_view/index.html" target="_blank">Org Login </calcite-button>
      </calcite-navigation>
      <calcite-shell-panel slot="panel-start"  display-mode="float-all" resizable>
        <calcite-panel id="subscription" collapsed>

                  <div id="formDiv"></div>  

        </calcite-panel>
    </calcite-shell-panel>
      <arcgis-map item-id="845070ef0d1d4508a980d46535bb547c" zoom="4">
        <arcgis-zoom slot="bottom-left"></arcgis-zoom>
        <arcgis-home slot="bottom-left"></arcgis-home>
        <arcgis-locate slot="bottom-left"></arcgis-locate>
        <arcgis-layer-list slot="top-right"></arcgis-layer-list>
          <arcgis-time-slider
    layout="compact"
    mode="time-window"
    time-visible
    loop
    play-rate="500"
    slot="bottom-right"
  ></arcgis-time-slider>
      </arcgis-map>
      
    </calcite-shell>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
